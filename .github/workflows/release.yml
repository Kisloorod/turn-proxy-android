name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate Release Notes
        id: release_notes
        run: |
          echo "## TurnProxy VPN v${GITHUB_REF#refs/tags/v}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Что нового" >> release_notes.md
          echo "- WebRTC VPN клиент для Turn Proxy" >> release_notes.md
          echo "- Device token авторизация" >> release_notes.md
          echo "- Статистика трафика" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Установка" >> release_notes.md
          echo "1. Скачай APK (debug или release)" >> release_notes.md
          echo "2. Установи на Android 8.0+" >> release_notes.md
          echo "3. Введи device token из панели" >> release_notes.md
          echo "4. Подключись" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get APK size
        run: |
          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo ""
          echo "Release APK:"
          ls -lh app/build/outputs/apk/release/app-release.apk
